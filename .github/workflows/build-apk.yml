name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          # إنشاء مجلد التراخيص ووضع ملفات القبول لتجنب مشاكل Broken pipe
          LICENSE_DIR="$ANDROID_HOME/licenses"
          mkdir -p "$LICENSE_DIR"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$LICENSE_DIR/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a64810" >> "$LICENSE_DIR/android-sdk-license"
          echo "24333f8a43b682d23c5bbf81fb1d4f29a3a2a3b1" > "$LICENSE_DIR/android-sdk-preview-license"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          # توليد ملفات gradlew المفقودة تلقائياً داخل المشروع
          gradle wrapper

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maghamarat-Safiya-Waleed-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
