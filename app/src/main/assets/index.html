<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مغامرات صفية ووليد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* حاوية اللعبة أو الكانفاس لتناسب شاشة الجوال أفقياً */
        canvas, #gameCanvas, .game-screen {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .controls-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .btn {
            pointer-events: auto;
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        .left-controls {
            position: absolute;
            bottom: 15px;
            left: 20px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn-move {
            width: 55px;
            height: 55px;
        }

        .btn-jump {
            position: absolute;
            bottom: 15px;
            right: 25px;
            width: 65px;
            height: 65px;
            background: rgba(255, 200, 0, 0.3);
            border-color: rgba(255, 200, 0, 0.6);
            pointer-events: auto;
        }

        .top-bar {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
            z-index: 20;
        }

        .btn-top {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            cursor: pointer;
        }

        #about-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 350px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            text-align: center;
            z-index: 100;
            pointer-events: auto;
        }

        #about-modal h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        #about-modal p {
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .audio-toggle-btn {
            background: #ff9800;
            border: none;
            padding: 8px 16px;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .close-modal-btn {
            background: #e53935;
            border: none;
            padding: 6px 12px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- هنا يتم وضع كود اللعبة الأصلي (الكانفاس أو محتوى لعبتك الكامل) -->
        <canvas id="gameCanvas"></canvas>

        <!-- صوت الخلفية -->
        <audio id="bgMusic" loop autoplay>
            <source src="bg_music.mp3" type="audio/mpeg">
        </audio>

        <!-- القائمة العلوية (زر الخروج وحول اللعبة) -->
        <div class="top-bar">
            <button class="btn-top" onclick="exitApp()">✕ خروج</button>
            <button class="btn-top" onclick="openAbout()">ℹ حول اللعبة</button>
        </div>

        <!-- أزرار التحكم باللمس الخاصة بالجوال -->
        <div class="controls-layer">
            <div class="left-controls">
                <div class="btn btn-move" id="btnLeft">◄</div>
                <div class="btn btn-move" id="btnRight">►</div>
            </div>
            <div class="btn btn-jump" id="btnJump">▲</div>
        </div>

        <!-- نافذة حول اللعبة لإيقاف الصوت -->
        <div id="about-modal">
            <h3>مغامرات صفية ووليد</h3>
            <p>لعبة مغامرات ممتعة ومميزة.</p>
            <button class="audio-toggle-btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 إيقاف الصوت</button>
            <br>
            <button class="close-modal-btn" onclick="closeAbout()">إغلاق</button>
        </div>
    </div>

    <script>
        // إعدادات الصوت التلقائي
        const bgMusic = document.getElementById('bgMusic');
        const audioBtn = document.getElementById('audioToggleBtn');

        window.addEventListener('DOMContentLoaded', () => {
            bgMusic.play().catch(() => {
                document.addEventListener('touchstart', () => bgMusic.play(), { once: true });
            });
        });

        function toggleAudio() {
            if (bgMusic.paused) {
                bgMusic.play();
                audioBtn.innerText = "🔊 إيقاف الصوت";
            } else {
                bgMusic.pause();
                audioBtn.innerText = "🔇 تشغيل الصوت";
            }
        }

        function openAbout() {
            document.getElementById('about-modal').style.display = 'block';
        }

        function closeAbout() {
            document.getElementById('about-modal').style.display = 'none';
        }

        function exitApp() {
            if (window.AndroidApp && window.AndroidApp.exitGame) {
                window.AndroidApp.exitGame();
            } else {
                window.history.back();
            }
        }

        // محاكاة أزرار التحكم للألعاب (يمكنك ربطها بدوال اللعبة الأصلية لديك)
        function simulateKey(keyCode, eventType) {
            const event = new KeyboardEvent(eventType, { key: keyCode, bubbles: true });
            window.dispatchEvent(event);
        }

        document.getElementById('btnLeft').addEventListener('touchstart', () => simulateKey('ArrowLeft', 'keydown'));
        document.getElementById('btnLeft').addEventListener('touchend', () => simulateKey('ArrowLeft', 'keyup'));
        
        document.getElementById('btnRight').addEventListener('touchstart', () => simulateKey('ArrowRight', 'keydown'));
        document.getElementById('btnRight').addEventListener('touchend', () => simulateKey('ArrowRight', 'keyup'));
        
        document.getElementById('btnJump').addEventListener('touchstart', () => simulateKey('ArrowUp', 'keydown'));
        document.getElementById('btnJump').addEventListener('touchend', () => simulateKey('ArrowUp', 'keyup'));
    </script>
</body>
</html>
