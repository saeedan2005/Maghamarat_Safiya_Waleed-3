<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>مغامرات صفية والوليد — ١٠ مراحل</title>
    <style>
        @font-face{font-family:ArabicUI;src:local('Tahoma'),local('Arial')}
        *{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
        html, body{width:100vw;height:100vh;overflow:hidden;margin:0;font-family:ArabicUI,Tahoma,Arial,sans-serif;background:#000;color:#26324a}
        
        #game-container{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#b6efff}
        
        /* ضبط الكانفاس لملء الشاشة أفقياً */
        canvas, .game {width:100%!important;height:100%!important;object-fit:contain;display:block}

        /* شريط القائمة العلوي (خروج وحول اللعبة) */
        .top-bar{position:absolute;top:10px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:999;pointer-events:auto}
        .btn-top{padding:6px 14px;border-radius:20px;font-size:13px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.5);color:#fff;cursor:pointer}

        /* أزرار التحكم بالجوال (شفافة وصغيرة) */
        .controls-layer{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:999;pointer-events:none}
        .left-controls{display:flex;gap:15px;pointer-events:auto}
        .ctrl-btn{width:55px;height:55px;border:2px solid rgba(255,255,255,0.6);border-radius:50%;background:rgba(255,255,255,0.25);color:white;font-size:22px;font-weight:bold;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
        .ctrl-btn:active{background:rgba(255,255,255,0.5)}
        .btn-jump{width:65px;height:65px;background:rgba(255,200,0,0.35);border-color:rgba(255,200,0,0.7);pointer-events:auto}

        /* نافذة حول اللعبة */
        #about-modal {display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;max-width:350px;background:rgba(20,20,20,0.95);border:2px solid #ffd700;border-radius:12px;padding:20px;color:#fff;text-align:center;z-index:1000;pointer-events:auto}
        #about-modal h3{margin-bottom:10px;color:#ffd700}
        #about-modal p{font-size:13px;margin-bottom:15px;line-height:1.4}
        .audio-toggle-btn{background:#ff9800;border:none;padding:8px 16px;color:white;font-weight:bold;border-radius:6px;margin-bottom:15px;cursor:pointer}
        .close-modal-btn{background:#e53935;border:none;padding:6px 12px;color:white;border-radius:6px;cursor:pointer}
    </style>
</head>
<body>

    <div id="game-container">
        <!-- القائمة العلوية للخروج وحول اللعبة -->
        <div class="top-bar">
            <button class="btn-top" onclick="exitApp()">✕ خروج</button>
            <button class="btn-top" onclick="openAbout()">ℹ حول اللعبة</button>
        </div>

        <!-- صوت الخلفية -->
        <audio id="bgMusic" loop autoplay>
            <source src="bg_music.mp3" type="audio/mpeg">
        </audio>

        <!-- أزرار التحكم للشاشة -->
        <div class="controls-layer">
            <div class="left-controls">
                <div class="ctrl-btn" id="btnLeft">◄</div>
                <div class="ctrl-btn" id="btnRight">►</div>
            </div>
            <div class="ctrl-btn btn-jump" id="btnJump">▲</div>
        </div>

        <!-- نافذة حول اللعبة والصوت -->
        <div id="about-modal">
            <h3>مغامرات صفية ووليد</h3>
            <p>لعبة المغامرات الشيقة والمصممة خصيصاً للجوال.</p>
            <button class="audio-toggle-btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 إيقاف الصوت</button>
            <br>
            <button class="close-modal-btn" onclick="closeAbout()">إغلاق</button>
        </div>

        <!-- محتوى لعبتك الأصلي بالكامل -->
        <div id="app" style="width:100%; height:100%;">
            <!-- هنا سيتم تحميل محرك ولعبة صفية ووليد الأصلية -->
        </div>
    </div>

    <script>
        // دمج محتوى لعبتك الأصلي هنا وتفعيل الأزرار الصوتية والتحكم
        const bgMusic = document.getElementById('bgMusic');
        const audioBtn = document.getElementById('audioToggleBtn');

        window.addEventListener('DOMContentLoaded', () => {
            bgMusic.play().catch(() => {
                document.addEventListener('touchstart', () => bgMusic.play(), { once: true });
            });
        });

        function toggleAudio() {
            if (bgMusic.paused) {
                bgMusic.play();
                audioBtn.innerText = "🔊 إيقاف الصوت";
            } else {
                bgMusic.pause();
                audioBtn.innerText = "🔇 تشغيل الصوت";
            }
        }

        function openAbout() {
            document.getElementById('about-modal').style.display = 'block';
        }

        function closeAbout() {
            document.getElementById('about-modal').style.display = 'none';
        }

        function exitApp() {
            if (window.AndroidApp && window.AndroidApp.exitGame) {
                window.AndroidApp.exitGame();
            } else {
                window.history.back();
            }
        }

        // ربط أزرار التحكم باللمس مع محرك اللعبة
        function simulateKey(code, type) {
            window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true }));
        }

        document.getElementById('btnLeft').addEventListener('touchstart', () => simulateKey('ArrowLeft', 'keydown'));
        document.getElementById('btnLeft').addEventListener('touchend', () => simulateKey('ArrowLeft', 'keyup'));
        document.getElementById('btnRight').addEventListener('touchstart', () => simulateKey('ArrowRight', 'keydown'));
        document.getElementById('btnRight').addEventListener('touchend', () => simulateKey('ArrowRight', 'keyup'));
        document.getElementById('btnJump').addEventListener('touchstart', () => simulateKey('ArrowUp', 'keydown'));
        document.getElementById('btnJump').addEventListener('touchend', () => simulateKey('ArrowUp', 'keyup'));
    </script>
</body>
</html>
